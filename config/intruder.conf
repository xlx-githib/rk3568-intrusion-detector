# ============================================================
# RK3568 智能安防区域入侵检测与告警系统 — 配置文件
# 格式：key=value，# 开头为注释
# ============================================================

# ---------- 视频输入 ----------
# input_type: mipi(OV13850) | video(视频文件，调试用)
input_type=video
# MIPI 摄像头设备节点，用 v4l2-ctl --list-devices 查询
video_device=/dev/video0
# input_type=video 时的文件路径
video_file=/home/root/test.mp4
# 采集分辨率（后续接入 ISP/采集时生效）
frame_width=1920
frame_height=1080
fps_target=30

# ---------- 模型 / 推理 ----------
# 模型路径（相对仓库根目录，见 models/README.md）
model_path=models/yolov5s.rknn
# NPU 输入边长（YOLOv5 一般 320/416/640）
model_input_size=640
conf_threshold=0.25
nms_threshold=0.45
# 关注的 COCO 类别（白名单，逗号分隔；yolov5s.cfg 的类别名见 class_names 配置）
classes=person,car

# ---------- 业务：警戒区域 ROI（像素坐标，相对采集分辨率）----------
# ROI 为矩形 [roi_x, roi_y] 为左上角，roi_w/roi_h 为宽高
roi_x=200
roi_y=150
roi_w=600
roi_h=400
# 目标在 ROI 内连续停留超过该秒数即触发告警
stay_alarm_sec=3

# ---------- 输出 ----------
draw_enable=1            # 是否在画面上叠加绘制
save_snapshot=1          # 告警时是否截图存盘
snapshot_dir=shots
log_dir=logs

# ---------- 网络上报 ----------
report_enable=1
server_ip=192.168.1.100   # PC 上位机 IP
server_port=9000
